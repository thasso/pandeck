name: CI

on:
  push:
    branches: [main]
  # Gate every base branch, including stacked work and fork pull requests.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # History-relative checks compare with this PR's base, not always main.
  PA_BASE_REF: ${{ github.event.pull_request.base.sha }}

jobs:
  # Every gate except the test suites. The only job that saves caches.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the workspace
        id: setup
        uses: ./.github/actions/setup-workspace

      - name: Package config contains no secrets
        run: pnpm run check:package-config-secrets

      # PRs, including forks, never publish caches. GitHub also scopes their
      # cache access to the PR merge ref, which main cannot restore from.
      - name: Save pnpm store
        if:
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.setup.outputs.pnpm-cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.setup.outputs.pnpm-store }}
          key:
            pnpm-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.setup.outputs.week
            }}

      - name: Restore Prettier cache
        id: prettier-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules/.cache/prettier
          key:
            prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.json',
            '.prettierignore') }}-${{ steps.setup.outputs.week }}
          restore-keys: |
            prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.json', '.prettierignore') }}-
            prettier-

      - name: Format check
        run: pnpm run format:check

      - name: Save Prettier cache
        if:
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.prettier-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules/.cache/prettier
          key:
            prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.json',
            '.prettierignore') }}-${{ steps.setup.outputs.week }}

      - name: Lint
        run: pnpm run lint

      - name: Dead-code budgets
        run: pnpm run lint:deadcode

      - name: Instruction document budgets
        run: pnpm run check:instructions

      - name: Migration lock is append-only
        run: node scripts/check-migrations-lock.mjs

      - name: Prompt and schema budgets
        run: pnpm run check:prompts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Script and shared tests
        run: |
          pnpm run test:release
          pnpm run test:package-config-secrets
          node --test scripts/run-engine-contract.test.mjs
          pnpm --filter @assistant/shared test

      - name: Build
        run: pnpm run build

  # The server suite is most of CI's wall time, so it is sharded by file.
  test-server:
    name: test-server (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      # Vitest defaults to one worker below the CPU count, a single worker on
      # a 2-vCPU runner; one per CPU is ~24% faster there, and more is not.
      - name: Server tests
        run:
          pnpm --filter @assistant/server exec vitest run --maxWorkers=100%
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  test-web:
    name: test-web (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Web tests
        run:
          pnpm --filter @assistant/web exec vitest run --maxWorkers=100%
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # The real engine CLI against fakes, in a user, network and PID namespace
  # with loopback alone (`docs/workers.md` "Engine-version guard").
  engine-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Engine contract
        run: pnpm run test:engine-contract

  nix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      nar-hash: ${{ steps.nar.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          # All inputs are public; no secrets or private binary cache.
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The package's install check boots and probes the server under packaged
      # Bun. The module checks remain gates, even though CI no longer deploys.
      - name: Build the production package and its flake checks
        run: |
          nix build \
            .#personal-assistant \
            .#checks.x86_64-linux.personal-assistant-closure \
            .#checks.x86_64-linux.personal-assistant-preview-isolation \
            .#checks.x86_64-linux.personal-assistant-oom-policy \
            .#checks.x86_64-linux.personal-assistant-gateway-unit \
            .#checks.x86_64-linux.personal-assistant-gateway-off \
            .#checks.x86_64-linux.personal-assistant-preview-ports \
            --print-build-logs

      - name: Record the package's NAR hash
        id: nar
        run: |
          out=$(nix path-info .#personal-assistant)
          echo "hash=$(nix-store --query --hash "$out")" >> "$GITHUB_OUTPUT"

  # Reproducibility: a second, independent build of the package on another
  # runner, compared by NAR hash. It runs beside nix-build instead of after it.
  nix-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      nar-hash: ${{ steps.nar.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          # All inputs are public; no secrets or private binary cache.
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the production package
        run: nix build .#personal-assistant --print-build-logs

      - name: Record the package's NAR hash
        id: nar
        run: |
          out=$(nix path-info .#personal-assistant)
          echo "hash=$(nix-store --query --hash "$out")" >> "$GITHUB_OUTPUT"

  reproducible:
    needs: [nix-build, nix-rebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both builds produced the same package
        env:
          FIRST: ${{ needs.nix-build.outputs.nar-hash }}
          SECOND: ${{ needs.nix-rebuild.outputs.nar-hash }}
        run: |
          echo "nix-build:   $FIRST"
          echo "nix-rebuild: $SECOND"
          if [ -z "$FIRST" ] || [ "$FIRST" != "$SECOND" ]; then
            echo "::error::The package is not reproducible: two independent builds differ."
            exit 1
          fi

  # The macOS app with its bundled local server (docs/desktop-local-mode.md).
  # An artifact for testing, not a release: ad-hoc signed and not notarized,
  # so it is not part of the required gate yet.
  desktop-macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Build the server package
        env:
          ASSISTANT_BUILD_COMMIT: ${{ github.sha }}
        run: pnpm run desktop:runtime

      # The server as the shell starts it, with the stock macOS host tools:
      # it must answer on loopback, refuse another Host name, and stop once
      # its parent is gone. The subshell stands in for the shell and is
      # SIGKILLed, as a crash would leave it.
      - name: Smoke the server package
        working-directory: app/shell/local-runtime
        run: |
          data=$(mktemp -d)
          (
            NODE_ENV=production ASSISTANT_RUNTIME_DIR="$PWD" \
              ASSISTANT_DESKTOP_SHELL=1 ASSISTANT_HOST=127.0.0.1 \
              ASSISTANT_PORT=47123 DATA_DIR="$data" \
              ./personal-assistant-server server.js \
              > "$data/server.log" 2>&1 &
            echo $! > "$data/pid"
            wait
          ) &
          parent=$!
          for _ in $(seq 120); do
            curl -fsS http://127.0.0.1:47123/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:47123/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Host: rebound.example:47123' \
            http://127.0.0.1:47123/api/health)" = 421
          server=$(cat "$data/pid")
          kill -KILL "$parent"
          for _ in $(seq 30); do
            kill -0 "$server" 2> /dev/null || break
            sleep 1
          done
          cat "$data/server.log"
          ! kill -0 "$server" 2> /dev/null

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.11.5 --locked

      - name: Shell unit tests
        working-directory: app/shell
        run: cargo test --locked

      - name: Build the app
        working-directory: app/shell
        run: >-
          cargo tauri build --bundles app,dmg --config tauri.bundled-server.json
          --config tauri.preview.json

      - name: Upload the disk image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pandeck-preview-macos-arm64
          path: app/shell/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  # The one check branch protection requires. A job skipped because a
  # dependency failed reports `skipped`, which GitHub counts as passing for a
  # required check, so this gate demands `success` from every job instead. It
  # runs on `always()`, not `!cancelled()`: a cancelled run must fail the gate,
  # not skip it.
  ci:
    if: always()
    needs:
      [
        check,
        test-server,
        test-web,
        engine-contract,
        nix-build,
        nix-rebuild,
        reproducible,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
