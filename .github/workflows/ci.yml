name: CI

on:
  push:
    branches: [main]
  # Gate every base branch, including stacked work and fork pull requests.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # History-relative checks compare with this PR's base, not always main.
      PA_BASE_REF: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        # Worktree and merge tests need an ambient identity.
        run: |
          git config --global user.email "ci@localhost"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Cache window
        id: window
        run: |
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "pnpm-store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.window.outputs.pnpm-store }}
          key:
            pnpm-${{ hashFiles('pnpm-lock.yaml') }}-${{
            steps.window.outputs.week }}
          restore-keys: |
            pnpm-${{ hashFiles('pnpm-lock.yaml') }}-
            pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package config contains no secrets
        run: pnpm run check:package-config-secrets

      # PRs, including forks, never publish caches. GitHub also scopes their
      # cache access to the PR merge ref, which main cannot restore from.
      - name: Save pnpm store
        if:
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.window.outputs.pnpm-store }}
          key:
            pnpm-${{ hashFiles('pnpm-lock.yaml') }}-${{
            steps.window.outputs.week }}

      - name: Restore Prettier cache
        id: prettier-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/prettier
          key:
            prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.json',
            '.prettierignore') }}-${{ steps.window.outputs.week }}
          restore-keys: |
            prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.json', '.prettierignore') }}-
            prettier-

      - name: Format check
        run: pnpm run format:check

      - name: Save Prettier cache
        if:
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.prettier-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/prettier
          key:
            prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.json',
            '.prettierignore') }}-${{ steps.window.outputs.week }}

      - name: Lint
        run: pnpm run lint

      - name: Dead-code budgets
        run: pnpm run lint:deadcode

      - name: Instruction document budgets
        run: pnpm run check:instructions

      - name: Migration lock is append-only
        run: node scripts/check-migrations-lock.mjs

      - name: Prompt and schema budgets
        run: pnpm run check:prompts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:suites

      - name: Build
        run: pnpm run build

  nix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # All inputs are public; no secrets or private binary cache.
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The package's install check boots and probes the server under packaged
      # Bun. The module checks remain gates, even though CI no longer deploys.
      - name: Build the production package and its flake checks
        run: |
          nix build \
            .#personal-assistant \
            .#checks.x86_64-linux.personal-assistant-closure \
            .#checks.x86_64-linux.personal-assistant-preview-isolation \
            .#checks.x86_64-linux.personal-assistant-oom-policy \
            --print-build-logs

      - name: Verify the package is reproducible
        run: |
          nix build .#personal-assistant \
            --rebuild \
            --keep-failed \
            --print-build-logs
