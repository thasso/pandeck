name: CI

on:
  push:
    branches: [main]
  # Gate every base branch, including stacked work and fork pull requests.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # History-relative checks compare with this PR's base, not always main.
  PA_BASE_REF: ${{ github.event.pull_request.base.sha }}

jobs:
  # Every gate except the test suites. The only job that saves caches.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the workspace
        id: setup
        uses: ./.github/actions/setup-workspace

      - name: Package config contains no secrets
        run: pnpm run check:package-config-secrets

      # PRs, including forks, never publish caches. GitHub also scopes their
      # cache access to the PR merge ref, which main cannot restore from.
      - name: Save pnpm store
        if:
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.setup.outputs.pnpm-cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.setup.outputs.pnpm-store }}
          key:
            pnpm-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.setup.outputs.week
            }}

      - name: Restore Prettier cache
        id: prettier-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules/.cache/prettier
          key:
            prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.json',
            '.prettierignore') }}-${{ steps.setup.outputs.week }}
          restore-keys: |
            prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.json', '.prettierignore') }}-
            prettier-

      - name: Format check
        run: pnpm run format:check

      - name: Save Prettier cache
        if:
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.prettier-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules/.cache/prettier
          key:
            prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.json',
            '.prettierignore') }}-${{ steps.setup.outputs.week }}

      - name: Lint
        run: pnpm run lint

      - name: Dead-code budgets
        run: pnpm run lint:deadcode

      - name: Instruction document budgets
        run: pnpm run check:instructions

      - name: Migration lock is append-only
        run: node scripts/check-migrations-lock.mjs

      - name: Prompt and schema budgets
        run: pnpm run check:prompts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Script and shared tests
        run: |
          pnpm run test:release
          pnpm run test:package-config-secrets
          node --test scripts/run-engine-contract.test.mjs
          node --test scripts/bun-package-platform.test.mjs
          pnpm --filter @assistant/shared test

      - name: Build
        run: pnpm run build

  # The server suite is most of CI's wall time, so it is sharded by file.
  test-server:
    name: test-server (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      # Vitest defaults to one worker below the CPU count, a single worker on
      # a 2-vCPU runner; one per CPU is ~24% faster there, and more is not.
      - name: Server tests
        run:
          pnpm --filter @assistant/server exec vitest run --maxWorkers=100%
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  test-web:
    name: test-web (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Web tests
        run:
          pnpm --filter @assistant/web exec vitest run --maxWorkers=100%
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # The real engine CLI against fakes, in a user, network and PID namespace
  # with loopback alone (`docs/workers.md` "Engine-version guard").
  engine-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Engine contract
        run: pnpm run test:engine-contract

  # Native runtime spike only, not a signed Tauri app or a clean-Mac receipt.
  package-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      # CI prerequisites only. This does not choose how the desktop app will
      # distribute host tools. Production boot still enforces host-tools.json.
      - name: Provide required host tools on CI PATH
        run: |
          brew install bash coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Build the native runtime
        env:
          ASSISTANT_BUILD_COMMIT: ${{ github.sha }}
        run: |
          pnpm run build
          bun scripts/build-bun-server-bundle.mjs "$RUNNER_TEMP/pandeck-runtime"
          {
            echo "commit=$ASSISTANT_BUILD_COMMIT"
            sw_vers
            uname -sm
            node --version
            pnpm --version
            bun --version
            bash --version
            env --version
            file "$RUNNER_TEMP/pandeck-runtime/personal-assistant-server" \
              "$RUNNER_TEMP/pandeck-runtime/claude/claude" \
              "$RUNNER_TEMP/pandeck-runtime/native/watcher.node"
          } > "$RUNNER_TEMP/package-evidence.txt"

      # tar preserves executable permissions, unlike uploading the raw tree.
      # Smoke the extracted archive, so the downloadable layout is exercised.
      - name: Archive and smoke the native package
        run: |
          tar -czf "$RUNNER_TEMP/pandeck-runtime-darwin-arm64.tar.gz" \
            -C "$RUNNER_TEMP/pandeck-runtime" .
          mkdir "$RUNNER_TEMP/smoke-runtime"
          tar -xzf "$RUNNER_TEMP/pandeck-runtime-darwin-arm64.tar.gz" \
            -C "$RUNNER_TEMP/smoke-runtime"
          bun scripts/smoke-bun-server-package.mjs "$RUNNER_TEMP/smoke-runtime" \
            2>&1 | tee "$RUNNER_TEMP/package-smoke.log"
          cd "$RUNNER_TEMP"
          shasum -a 256 pandeck-runtime-darwin-arm64.tar.gz > package-sha256.txt

      - name: Upload runtime and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pandeck-runtime-darwin-arm64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pandeck-runtime-darwin-arm64.tar.gz
            ${{ runner.temp }}/package-evidence.txt
            ${{ runner.temp }}/package-smoke.log
            ${{ runner.temp }}/package-sha256.txt
          if-no-files-found: error
          retention-days: 14

  # The desktop app in local mode: the Tauri shell with the native runtime
  # bundled, built unsigned (ad-hoc), then launched in the runner's GUI session.
  # Its receipts are CI evidence, not a signed real-Mac or notarized release.
  desktop-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      # CI prerequisites only, as in package-macos-arm64: not a host-tool
      # distribution policy. The server's boot check still enforces them.
      - name: Provide required host tools on CI PATH
        run: |
          brew install bash coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      # tar round trip, as the runtime artifact does, so permissions and
      # layout match the downloadable package.
      - name: Build the native runtime into the shell
        env:
          ASSISTANT_BUILD_COMMIT: ${{ github.sha }}
        run: |
          pnpm run build
          bun scripts/build-bun-server-bundle.mjs "$RUNNER_TEMP/pandeck-runtime"
          tar -czf "$RUNNER_TEMP/runtime.tar.gz" -C "$RUNNER_TEMP/pandeck-runtime" .
          mkdir app/shell/local-runtime
          tar -xzf "$RUNNER_TEMP/runtime.tar.gz" -C app/shell/local-runtime

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.11.5 --locked

      - name: Shell unit tests
        working-directory: app/shell
        run: cargo test --locked

      - name: Build the app bundle
        working-directory: app/shell
        run: |
          cargo tauri build --bundles app --config tauri.local-runtime.json
          echo "APP=$PWD/target/release/bundle/macos/Pandeck.app" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/desktop-evidence"

      - name: Verify the bundle
        run: |
          runtime="$APP/Contents/Resources/pandeck-runtime"
          {
            echo "commit=${{ github.sha }}"
            sw_vers
            uname -sm
            rustc --version
            cargo tauri --version
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
            file "$APP/Contents/MacOS/"* "$runtime/personal-assistant-server" \
              "$runtime/claude/claude" "$runtime/native/watcher.node"
            echo "--- linked libraries"
            otool -L "$APP/Contents/MacOS/"* "$runtime/personal-assistant-server" \
              "$runtime/native/watcher.node"
            echo "--- signature (ad-hoc expected; recorded, not enforced)"
            codesign -dv "$APP" 2>&1 || true
            codesign --verify --deep --strict "$APP" 2>&1 && echo "verify: ok" || echo "verify: failed"
          } 2>&1 | tee "$RUNNER_TEMP/desktop-evidence/bundle-evidence.txt"
          # Bundled native code may link only the OS, never the build host.
          if otool -L "$APP/Contents/MacOS/"* "$runtime/personal-assistant-server" \
            "$runtime/native/watcher.node" | grep -E '^\s' |
            grep -vE '^\s+(/usr/lib/|/System/Library/|@rpath/|@loader_path/|@executable_path/)'; then
            echo "bundled code links a library outside the OS" >&2
            exit 1
          fi
          bun scripts/smoke-bun-server-package.mjs "$runtime" \
            2>&1 | tee "$RUNNER_TEMP/desktop-evidence/bundled-runtime-smoke.log"

      # Headless: the shell's launcher (not the app) drives the bundled runtime.
      - name: Launcher receipt against the bundled runtime (headless)
        working-directory: app/shell
        run: |
          PA_LOCAL_RUNTIME_DIR="$APP/Contents/Resources/pandeck-runtime" \
            cargo test --locked bundled_runtime_lifecycle -- --ignored --nocapture \
            2>&1 | tee "$RUNNER_TEMP/desktop-evidence/receipt-headless-launcher.log"

      - name: Launch the app in the GUI session
        run:
          app/shell/scripts/smoke-macos-app.sh "$APP"
          "$RUNNER_TEMP/desktop-evidence"

      - name: Package the unsigned app
        if: always()
        run: |
          if [ -d "${APP:-}" ]; then
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Pandeck-darwin-arm64-unsigned.zip"
            cd "$RUNNER_TEMP"
            shasum -a 256 Pandeck-darwin-arm64-unsigned.zip > desktop-evidence/app-sha256.txt
          fi

      - name: Upload the app and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pandeck-desktop-darwin-arm64-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Pandeck-darwin-arm64-unsigned.zip
            ${{ runner.temp }}/desktop-evidence/
          if-no-files-found: warn
          retention-days: 14

  nix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      nar-hash: ${{ steps.nar.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          # All inputs are public; no secrets or private binary cache.
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The package's install check boots and probes the server under packaged
      # Bun. The module checks remain gates, even though CI no longer deploys.
      - name: Build the production package and its flake checks
        run: |
          nix build \
            .#personal-assistant \
            .#checks.x86_64-linux.personal-assistant-closure \
            .#checks.x86_64-linux.personal-assistant-preview-isolation \
            .#checks.x86_64-linux.personal-assistant-oom-policy \
            .#checks.x86_64-linux.personal-assistant-gateway-unit \
            .#checks.x86_64-linux.personal-assistant-gateway-off \
            .#checks.x86_64-linux.personal-assistant-preview-ports \
            --print-build-logs

      - name: Record the package's NAR hash
        id: nar
        run: |
          out=$(nix path-info .#personal-assistant)
          echo "hash=$(nix-store --query --hash "$out")" >> "$GITHUB_OUTPUT"

  # Reproducibility: a second, independent build of the package on another
  # runner, compared by NAR hash. It runs beside nix-build instead of after it.
  nix-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      nar-hash: ${{ steps.nar.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          # All inputs are public; no secrets or private binary cache.
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the production package
        run: nix build .#personal-assistant --print-build-logs

      - name: Record the package's NAR hash
        id: nar
        run: |
          out=$(nix path-info .#personal-assistant)
          echo "hash=$(nix-store --query --hash "$out")" >> "$GITHUB_OUTPUT"

  reproducible:
    needs: [nix-build, nix-rebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both builds produced the same package
        env:
          FIRST: ${{ needs.nix-build.outputs.nar-hash }}
          SECOND: ${{ needs.nix-rebuild.outputs.nar-hash }}
        run: |
          echo "nix-build:   $FIRST"
          echo "nix-rebuild: $SECOND"
          if [ -z "$FIRST" ] || [ "$FIRST" != "$SECOND" ]; then
            echo "::error::The package is not reproducible: two independent builds differ."
            exit 1
          fi

  # The one check branch protection requires. A job skipped because a
  # dependency failed reports `skipped`, which GitHub counts as passing for a
  # required check, so this gate demands `success` from every job instead. It
  # runs on `always()`, not `!cancelled()`: a cancelled run must fail the gate,
  # not skip it.
  ci:
    if: always()
    needs:
      [
        check,
        test-server,
        test-web,
        engine-contract,
        package-macos-arm64,
        desktop-macos-arm64,
        nix-build,
        nix-rebuild,
        reproducible,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
