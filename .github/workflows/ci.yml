name: CI

on:
  push:
    branches: [main]
  # Gate every base branch, including stacked work and fork pull requests.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # History-relative checks compare with this PR's base, not always main.
  PA_BASE_REF: ${{ github.event.pull_request.base.sha }}

jobs:
  # Every gate except the test suites. The only job that saves caches.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the workspace
        id: setup
        uses: ./.github/actions/setup-workspace

      - name: Package config contains no secrets
        run: pnpm run check:package-config-secrets

      # PRs, including forks, never publish caches. GitHub also scopes their
      # cache access to the PR merge ref, which main cannot restore from.
      - name: Save pnpm store
        if:
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.setup.outputs.pnpm-cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.setup.outputs.pnpm-store }}
          key:
            pnpm-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.setup.outputs.week
            }}

      - name: Restore Prettier cache
        id: prettier-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules/.cache/prettier
          key:
            prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.json',
            '.prettierignore') }}-${{ steps.setup.outputs.week }}
          restore-keys: |
            prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.json', '.prettierignore') }}-
            prettier-

      - name: Format check
        run: pnpm run format:check

      - name: Save Prettier cache
        if:
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.prettier-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules/.cache/prettier
          key:
            prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.json',
            '.prettierignore') }}-${{ steps.setup.outputs.week }}

      - name: Lint
        run: pnpm run lint

      - name: Dead-code budgets
        run: pnpm run lint:deadcode

      - name: Instruction document budgets
        run: pnpm run check:instructions

      - name: Migration lock is append-only
        run: node scripts/check-migrations-lock.mjs

      - name: Prompt and schema budgets
        run: pnpm run check:prompts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Script and shared tests
        run: |
          pnpm run test:release
          pnpm run test:package-config-secrets
          pnpm --filter @assistant/shared test

      - name: Build
        run: pnpm run build

  # The server suite is most of CI's wall time, so it is sharded by file.
  test-server:
    name: test-server (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      # Vitest defaults to one worker below the CPU count, a single worker on
      # a 2-vCPU runner; one per CPU is ~24% faster there, and more is not.
      - name: Server tests
        run:
          pnpm --filter @assistant/server exec vitest run --maxWorkers=100%
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  test-web:
    name: test-web (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Web tests
        run:
          pnpm --filter @assistant/web exec vitest run --maxWorkers=100%
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  nix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      nar-hash: ${{ steps.nar.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Nix
        id: nix
        uses: ./.github/actions/setup-nix

      # The package's install check boots and probes the server under packaged
      # Bun. The module checks remain gates, even though CI no longer deploys.
      - name: Build the production package and its flake checks
        run: |
          nix build \
            .#personal-assistant \
            .#checks.x86_64-linux.personal-assistant-closure \
            .#checks.x86_64-linux.personal-assistant-preview-isolation \
            .#checks.x86_64-linux.personal-assistant-oom-policy \
            --print-build-logs

      - name: Record the package's NAR hash
        id: nar
        run: |
          out=$(nix path-info .#personal-assistant)
          echo "hash=$(nix-store --query --hash "$out")" >> "$GITHUB_OUTPUT"

      # Like the Node caches, only main publishes it.
      - name: Export the dependency store
        if:
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.nix.outputs.deps-cache-hit != 'true'
        run: |
          deps=$(nix eval --raw .#personal-assistant.pnpmDeps.outPath)
          nix-store --export "$deps" > "$RUNNER_TEMP/pnpm-deps.nar"

      - name: Save the dependency store
        if:
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.nix.outputs.deps-cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/pnpm-deps.nar
          key: ${{ steps.nix.outputs.deps-key }}

  # Reproducibility: a second, independent build of the package on another
  # runner, compared by NAR hash. It runs beside nix-build instead of after it.
  nix-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      nar-hash: ${{ steps.nar.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Build the production package
        run: nix build .#personal-assistant --print-build-logs

      - name: Record the package's NAR hash
        id: nar
        run: |
          out=$(nix path-info .#personal-assistant)
          echo "hash=$(nix-store --query --hash "$out")" >> "$GITHUB_OUTPUT"

  reproducible:
    needs: [nix-build, nix-rebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both builds produced the same package
        env:
          FIRST: ${{ needs.nix-build.outputs.nar-hash }}
          SECOND: ${{ needs.nix-rebuild.outputs.nar-hash }}
        run: |
          echo "nix-build:   $FIRST"
          echo "nix-rebuild: $SECOND"
          if [ -z "$FIRST" ] || [ "$FIRST" != "$SECOND" ]; then
            echo "::error::The package is not reproducible: two independent builds differ."
            exit 1
          fi

  # The one check branch protection requires. A job skipped because a
  # dependency failed reports `skipped`, which GitHub counts as passing for a
  # required check, so this gate demands `success` from every job instead. It
  # runs on `always()`, not `!cancelled()`: a cancelled run must fail the gate,
  # not skip it.
  ci:
    if: always()
    needs: [check, test-server, test-web, nix-build, nix-rebuild, reproducible]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
