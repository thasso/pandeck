name: Desktop

# The macOS app with its bundled local server (docs/desktop-local-mode.md).
# Too slow to run on every change, so it builds only when asked for and for a
# release tag. The disk image is ad-hoc signed and not notarized.
on:
  workflow_dispatch:
    inputs:
      preview:
        description:
          Build as "Pandeck Preview" with its own identity, so it can run beside
          an installed Pandeck app.
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # A tag builds the real app; a manual run follows its input.
      PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The shell's About panel reads the release tag from git.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Build the server package
        env:
          ASSISTANT_BUILD_COMMIT: ${{ github.sha }}
        run: pnpm run desktop:runtime

      # The server as the shell starts it, with the stock macOS host tools:
      # it must answer on loopback, refuse another Host name, and stop once
      # the shell is gone. A `bash -c` stands in for the shell, passes its own
      # pid like the shell does, and is SIGKILLed as a crash would leave it:
      # once while the server runs, once before it has even booted.
      - name: Smoke the server package
        working-directory: app/shell/local-runtime
        run: |
          export NODE_ENV=production ASSISTANT_RUNTIME_DIR="$PWD" \
            ASSISTANT_HOST=127.0.0.1 ASSISTANT_PORT=47123
          DATA_DIR=$(mktemp -d)
          export DATA_DIR
          launch="$RUNNER_TEMP/launch-as-shell.sh"
          cat > "$launch" << 'EOF'
          ASSISTANT_DESKTOP_SHELL=$$ ./personal-assistant-server server.js \
            >> "$DATA_DIR/server.log" 2>&1 &
          echo $! > "$DATA_DIR/pid"
          wait
          EOF
          # Start a stand-in shell and wait until it has spawned the server.
          start_shell() {
            rm -f "$DATA_DIR/pid"
            bash "$launch" &
            parent=$!
            until [ -s "$DATA_DIR/pid" ]; do sleep 0.05; done
          }
          stopped() {
            for _ in $(seq 30); do
              kill -0 "$1" 2> /dev/null || return 0
              sleep 1
            done
            return 1
          }

          start_shell
          for _ in $(seq 120); do
            curl -fsS http://127.0.0.1:47123/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:47123/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Host: rebound.example:47123' \
            http://127.0.0.1:47123/api/health)" = 421
          kill -KILL "$parent"
          stopped "$(cat "$DATA_DIR/pid")"

          start_shell
          kill -KILL "$parent"
          stopped "$(cat "$DATA_DIR/pid")"
          cat "$DATA_DIR/server.log"
          test "$(grep -c 'desktop shell is gone' "$DATA_DIR/server.log")" = 2

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.11.5 --locked

      - name: Shell unit tests
        working-directory: app/shell
        run: cargo test --locked

      - name: Build the app
        working-directory: app/shell
        run: |
          configs=(--config tauri.bundled-server.json)
          if [ "$PREVIEW" = true ]; then
            configs+=(--config tauri.preview.json)
          fi
          cargo tauri build --bundles app,dmg "${configs[@]}"

      - name: Upload the disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name:
            pandeck-${{ env.PREVIEW == 'true' && 'preview-' || ''
            }}macos-arm64-${{ github.ref_type == 'tag' && github.ref_name ||
            github.sha }}
          path: app/shell/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
