# TEMPORARY measurement workflow for the ci-speed draft PR; not for merge.
name: CI bench

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-workers:
    name: server full suite (maxWorkers=${{ matrix.workers }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workers: [2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Server tests
        run: |
          nproc
          free -m
          ( while sleep 5; do free -m | awk '/Mem:/ {print $3}'; done ) > /tmp/mem.log &
          pnpm --filter @assistant/server exec vitest run --maxWorkers=${{ matrix.workers }}
          echo "peak used MB: $(sort -n /tmp/mem.log | tail -1)"
