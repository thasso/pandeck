# The codemods in `scripts/codemods/` drive the JS compiler API
# (`ts.createProgram`), which TypeScript 7's native port no longer ships, so
# they run on TypeScript 6 while `tsc` — the authority on what typechecks —
# stays on the catalog's 7.x.
catalogs:
  codemods:
    typescript: "6.0.3"

# `@types/*` packages depend on `@types/node: *`, and the root/web importers
# bind Vite and Vitest to whatever that floats to. Pin the whole tree to the
# catalog's Node 24 line so `tsc` can never accept an API the packaged Node 24
# runtime lacks.
overrides:
  "@types/node": "catalog:"

# An entry WITHOUT a version exempts every version of that package, so the
# Claude agent SDK — which we deliberately track at latest, harness fixes and
# new Claude models included — never has to be re-listed on a bump. Everything
# else stays pinned to the exact version that was reviewed, so a fresh release
# still waits out `minimumReleaseAge` until someone bumps it on purpose.
minimumReleaseAgeExclude:
  - "@anthropic-ai/claude-agent-sdk"
  - "@anthropic-ai/claude-agent-sdk-*"
  - "@earendil-works/pi-agent-core@0.87.1"
  - "@earendil-works/pi-ai@0.87.1"
  - "@earendil-works/pi-coding-agent@0.87.1"
  - "@earendil-works/pi-tui@0.87.1"
  - "@anthropic-ai/sdk@0.128.0"
  - "@modelcontextprotocol/sdk@1.30.1"
  - knip@6.38.0
  - prettier@3.9.9
