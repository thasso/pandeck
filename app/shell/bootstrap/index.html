<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Pandeck</title>
    <style>
      /*
        The connecting screen, and the only UI the shell itself owns. It is on
        screen for a few hundred milliseconds on a good day, so it says as little
        as possible: no logo, no product name, nothing that would flash and then
        be replaced by the real app saying the same thing. It earns its place only
        when the server does NOT answer.
      */
      :root {
        color-scheme: dark;
        --bg: #0b0c10;
        --fg: #e6e8ee;
        --muted: #8b90a0;
        --line: #23262f;
        --accent: #6c8cff;
        --danger: #ff6b6b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        /* The whole surface drags: there is no content here to click past. */
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        width: 100%;
        max-width: 24rem;
        text-align: center;
      }
      .spinner {
        width: 1.25rem;
        height: 1.25rem;
        margin: 0 auto 1rem;
        border: 2px solid var(--line);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2.4s;
        }
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
      }
      p.error {
        color: var(--danger);
        white-space: pre-wrap;
        text-align: left;
        max-height: 12rem;
        overflow: auto;
        -webkit-user-select: text;
        user-select: text;
      }
      .choice {
        margin-bottom: 1.25rem;
      }
      .choice button {
        width: 100%;
      }
      p.small {
        font-size: 12px;
        -webkit-user-select: text;
        user-select: text;
      }
      form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 0.5rem 0.625rem;
        background: #14161c;
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        font: inherit;
        -webkit-user-select: text;
        user-select: text;
      }
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button {
        padding: 0.5rem 0.875rem;
        border-radius: 0.5rem;
        border: 1px solid var(--line);
        background: #14161c;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #0b0c10;
        font-weight: 600;
      }
      button:hover {
        border-color: var(--accent);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body data-tauri-drag-region>
    <main>
      <div id="connecting">
        <div class="spinner" role="status" aria-label="Connecting"></div>
        <p id="connecting-text">Connecting…</p>
      </div>

      <div id="failed" hidden>
        <h1 id="title">Can't reach the assistant</h1>
        <p class="error" id="reason"></p>
        <div class="choice" id="local-choice" hidden>
          <button type="button" class="primary" id="use-local">
            Use Pandeck on this Mac
          </button>
          <p class="small" id="local-detail" hidden></p>
        </div>
        <form id="server-form">
          <input
            id="server-url"
            type="url"
            inputmode="url"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            aria-label="Server URL"
          />
          <button type="submit" class="primary">Connect</button>
        </form>
        <p id="hint">
          Or connect to a Pandeck server. If it cannot be reached, check your
          network or VPN.
        </p>
      </div>
    </main>

    <script>
      const invoke = window.__TAURI__?.core?.invoke;
      const el = (id) => document.getElementById(id);

      // The server choice, as `get_server_choice` last described it.
      let choice = null;

      /** Show the failure state with a reason, seeding the field for a retry. */
      function fail(url, reason, title = "Can't reach the assistant") {
        el("connecting").hidden = true;
        el("failed").hidden = false;
        el("title").textContent = title;
        el("reason").textContent = reason;
        el("reason").hidden = !reason;
        el("server-url").value = url;
        const local = choice?.local;
        el("local-choice").hidden = !local || local.state === "unavailable";
        el("local-detail").hidden = !local?.logPath;
        el("local-detail").textContent = local?.logPath
          ? `Log: ${local.logPath}`
          : "";
      }

      /** Offer both servers without reconnecting: the `Server…` menu. */
      function choose() {
        const local = choice.local;
        const current =
          choice.mode === "local"
            ? `Now using Pandeck on this Mac (${local.state}).`
            : `Now using ${choice.remoteUrl}.`;
        fail(choice.remoteUrl, current, "Choose a server");
        if (local.state === "failed") el("reason").textContent = local.detail;
      }

      /**
       * Wait for the bundled server, then hand the window over. The shell
       * trusts the local origin before it reports ready, so the navigation
       * below is as safe as a probed remote one. A failure stops here: a
       * restart is the user's call, never a loop.
       */
      async function followLocal(status) {
        el("connecting").hidden = false;
        el("failed").hidden = true;
        el("connecting-text").textContent = "Starting Pandeck on this Mac…";
        for (;;) {
          if (status.state === "ready") {
            location.replace(status.url);
            return;
          }
          if (status.state !== "starting" && status.state !== "stopping") break;
          await new Promise((done) => setTimeout(done, 300));
          status = await invoke("local_server_status");
        }
        choice.local = status;
        fail(
          choice.remoteUrl,
          status.state === "failed"
            ? status.detail
            : "Pandeck on this Mac is not running.",
          "Pandeck on this Mac did not start",
        );
      }

      /**
       * Probe, then hand the window over. The probe is what keeps a dead server
       * from becoming a WebKit error page: navigation is one-way, and there is no
       * back button in a shell window to return here from.
       */
      async function connect(url, chooseServer = false) {
        el("connecting").hidden = false;
        el("failed").hidden = true;
        el("connecting-text").textContent =
          `Connecting to ${new URL(url).host}…`;
        try {
          if (await invoke("probe_server", { url })) {
            // Only a successfully probed explicit choice gains native trust.
            // The command grants trust before persisting or loading the URL.
            const target = chooseServer
              ? await invoke("set_server_url", { url })
              : url;
            location.replace(target);
            return;
          }
          fail(url, "The server answered, but not as the assistant.");
        } catch (err) {
          fail(url, String(err));
        }
      }

      el("use-local").addEventListener("click", async () => {
        try {
          choice.mode = "local";
          await followLocal(await invoke("use_local_server"));
        } catch (err) {
          fail(choice.remoteUrl, String(err));
        }
      });

      el("server-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const candidate = el("server-url").value.trim();
        try {
          await connect(candidate, true);
        } catch (err) {
          fail(candidate, String(err));
        }
      });

      if (!invoke) {
        fail("", "This page only runs inside the assistant shell.");
      } else {
        invoke("get_server_choice").then((current) => {
          choice = current;
          if (choice.choosing) choose();
          else if (choice.mode === "local") followLocal(choice.local);
          else connect(choice.remoteUrl);
        });
      }
    </script>
  </body>
</html>
